<!DOCTYPE html> 
<html>
    <head>
    <meta charset="UTF-8">
    <title>셀렉터</title>
    <style>
        /* 1. 전체 배경색: 민트색 */
        body {
            background-color: #d1f2eb; /* 민트색 */
            font-family: 'Malgun Gothic', sans-serif;
            font-size: 18px;
            padding: 20px;
        }

        /* 2. '얼굴' (h3): 좌측 정렬 + 초록색 글자 */
        h3 {
            color: green;
            text-align: left; /* 좌측 정렬 */
            font-size: 26px;
        }

        /* 3. '박인회' (div#center): 화면 중앙 정렬 */
        #center {
            text-align: center; /* 박인회를 가운데로 정렬 */
            margin-bottom: 15px;
        }

        /* '박인회' 글자 스타일: 파란 글씨 + 노란색 박스 */
        #center strong {
            color: blue;
            background-color: yellow;
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
        }

        /* 4. 시 내용 영역 (div.indent): 중앙으로 모이게 배치 */
        .indent {
            text-align: center; /* 시 내용을 화면 중앙에 모이게 함 */
        }

        /* 시 본문 p 태그: 첫 줄 한 칸 들여쓰기 */
        .indent p {
            display: inline-block; /* 내용 블록을 중앙에 예쁘게 배치 */
            text-align: left;      /* 중앙 모음 상태에서 글 줄 맞춤 */
            text-indent: 1em;      /* '길' 부분 첫 줄 한 칸 들여쓰기 */
            line-height: 1.8;
        }

        /* 5. '길' (em): 초록색 글자 */
        em {
            color: green;
            font-weight: bold;
            font-style: normal;
        }

        /* 6. '꽃' (.indent strong): 빨간색 글자 */
        .indent strong {
            color: red;
        }
    </style>
    </head>
    <body class="=main">
        <h3> 얼굴</h3>
        <hr>
        <div id="center"><strong>박인회</strong></div>
        <div class="indent">
       <p><em>길</em>을 걷고 산들 무어하리
       <strong>꽃</strong>이내가 아닌듯 내가
       <strong>꽃</strong>이 될 수 없는 지금...</p>
</div>
</body>
</html>
