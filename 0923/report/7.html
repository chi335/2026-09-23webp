<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>:hover활용</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 30px;
        }

        /* 내용과 카드를 가로로 배치하기 위한 컨테이너 */
        .container {
            display: flex;
            align-items: center; /* 세로 중앙 정렬 */
            gap: 20px;           /* 글자와 카드 사이 간격 */
        }

        /* 카드 영역 전체 크기 설정 */
        .card-box {
            width: 120px;
            height: 170px;
            perspective: 1000px; /* 3D 효과를 위한 원근감 */
        }

        /* 카드 내부 (3D 회전 애니메이션 적용) */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s; /* 부드럽게 뒤집히는 시간 */
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* 🔥 핵심: 마우스를 올렸을 때(:hover) 카드를 180도 회전 */
        .card-box:hover .card {
            transform: rotateY(180deg);
        }

        /* 카드 앞면, 뒷면 공통 스타일 */
        .card-back, .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 뒤집혔을 때 뒷면 안 보이게 처리 */
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        /* 1. 기본 상태: 카드 뒷면 */
        .card-back {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: 2px solid #102a56;
        }

        /* 2. hover 시 보일 상태: 카드 앞면 */
        .card-front {
            background-color: #ffffff;
            color: #d9534f;
            border: 2px solid #ccc;
            transform: rotateY(180deg); /* 미리 180도 돌려놓음 */
        }

        .card-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <h3>:hover활용</h3>
    <hr>

    <div class="container">
        <!-- 설명 글 -->
        <p>마우스를 올리면 카드의 앞면이 보인다</p>

        <!-- 카드 <div> 태그 영역 -->
        <div class="card-box">
            <div class="card">
                <!-- 카드 뒷면 (기본으로 보이는 면) -->
                <div class="card-back">
                    <div class="card-icon">🂠</div>
                    <div>뒷면</div>
                </div>

                <!-- 카드 앞면 (마우스 hover 시 보이는 면) -->
                <div class="card-front">
                    <div class="card-icon">A ♥</div>
                    <div>앞면</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
