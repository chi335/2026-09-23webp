<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이미지 테두리 만들기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 30px;
        }

        /* 액자 스타일 적용 */
        .frame-img {
            width: 350px;              /* 이미지 가로 크기 */
            height: auto;

            /* 1. 액자 테두리: 두께 15px, 입체감 있는 ridge 스타일 */
            border: 15px ridge #8b4513; 

            /* 2. 패딩: 5px (테두리와 이미지 사이의 공간) */
            padding: 5px;

            /* 3. 테두리와 이미지 사이 공간의 배경색 */
            background-color: #ffffff;

            /* 4. 그림자 효과 추가 */
            box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <h3>이미지 테두리 만들기</h3>
    <hr>

    <!-- 
      👇 src="image.jpg" 부분에 본인이 가지고 계신 이미지 파일명을 적어주세요.
      예: src="photo.jpg" 또는 src="내사진.png"
    -->
    <img class="frame-img" src="image.jpg" alt="테두리 이미지">

</body>
</html>
