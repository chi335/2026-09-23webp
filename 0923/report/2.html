<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>텍스트 꾸미기</title>
    <style>
        /* <p> 태그: 연한 하늘색 박스, 갈색 글자, 10px 크기, Lucida Console 폰트 */
        p {
            background-color: aliceblue;  /* 연한 하늘색 박스 배경 */
            color: brown;                  /* 글자 색상 갈색 */
            font-family: "Lucida Console", sans-serif; /* Lucida Console 폰트 */
            font-size: 10px;               /* 기본 글자 크기 10px */
            padding: 15px;                 /* 박스 느낌을 주는 안쪽 여백 */
            border-radius: 5px;            /* 박스 모서리 둥글게 */
        }

        /* <span> 태그: 부모(10px)보다 1.5배 크고 밑줄 적용 */
        span {
            font-size: 1.5em;              /* 10px의 1.5배 = 15px */
            text-decoration: underline;    /* 밑줄 치기 */
        }
    </style>
</head>
<body>
    <h3>텍스트와 폰트</h3>
    <hr>
    <p>
        AliceBlue 바탕색에 Brown 색의 "Lucida Console" 폰트로 10px 크기이고 
        <span>저는 이보다 1.5배 큽니다.</span> 
        
    </p>
</body>
</html>
