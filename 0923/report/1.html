<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>태그 셀렉터 만들기</title>
    <style>
        /* 태그 이름 셀렉터 사용 */

        /* <body> 태그 스타일: 전체 브라우저 배경색을 mistyrose로 설정 */
        body {
            background-color: mistyrose;
        }

        /* <h3> 태그 스타일: 글자색 파란색 */
        h3 {
            color: blue;
        }

        /* <span> 태그 스타일: 글자색 파란색 + 형광펜(배경색) 효과 */
        span {
            color: blue;
            background-color: yellow; /* 형광펜 색상 */
        }
    </style>
</head>
<body>
    <h3>소연재</h3>
    <hr>
    <p>저는 체조 선수 소연재입니다. <span>음악</span>을 들으면서 책읽기를 좋아합니다.
    <span>김치찌개</span>와 <span>막국수</span>를 무척 좋아합니다.
    </p>
</body>
</html>
